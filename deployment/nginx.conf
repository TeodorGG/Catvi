# Install in Nginx's http context. Replace the domain and certificate paths.
# Host Nginx terminates HTTPS and reaches the loopback-only container ports.
server {
    listen 80;
    server_name catvi.example.md;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name catvi.example.md;
    ssl_certificate /etc/letsencrypt/live/catvi.example.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catvi.example.md/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    client_max_body_size 17m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        # Replace forwarded headers so external clients cannot spoof rate-limit IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        # Disable Brotli here as well if your Nginx installation enables it.
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
