# CATVI — directive Nginx adiționale pentru Plesk
#
# Se lipesc în: Websites & Domains → catvi.md → Apache & nginx Settings →
# "Additional nginx directives". NU se adaugă aici `server { }`, `listen`,
# `server_name` sau `ssl_certificate`: Plesk le generează deja. Aici intră
# doar blocuri `location`.
#
# Rolul lor: browserul cere https://catvi.md/api/..., iar Nginx trimite
# cererea la aplicația backend de pe subdomeniu. Vizitatorul rămâne pe
# același origin, deci nu există CORS și nici preflight OPTIONS înainte de
# fiecare măsurătoare.
#
# De ce contează: motorul de test trimite antetul X-Test-Token, care este un
# antet „non-simplu”. Dacă front-end-ul ar chema direct https://api.catvi.md,
# browserul ar face o cerere OPTIONS înaintea fiecărei cereri, iar backend-ul
# nu trimite Access-Control-Max-Age — deci preflight-ul s-ar repeta în timpul
# testului. Ping-ul măsurat ar include acel round-trip suplimentar.

# Dimensiunea maximă a unui transfer de test (16 MiB + marjă).
client_max_body_size 17m;

location /api/ {
    # ATENȚIE: fără bară la final. `proxy_pass https://api.catvi.md;` trimite
    # calea neatinsă, deci /api/speedtest/session ajunge la backend ca
    # /api/speedtest/session — exact rutele definite în app.js.
    # Cu bară (`https://api.catvi.md/;`) Nginx ar tăia prefixul /api/ și
    # toate rutele ar da 404.
    proxy_pass https://api.catvi.md;

    proxy_http_version 1.1;
    proxy_set_header Host api.catvi.md;
    proxy_set_header Connection '';

    # Rescrie antetele: altfel un client extern poate falsifica IP-ul folosit
    # de limitarea de rată din backend.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Obligatoriu pentru măsurători corecte.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    # Dacă instalarea Nginx are Brotli activ global, dezactivează-l și aici:
    # brotli off;

    # Un test poate dura; peste limitele implicite ale Plesk.
    proxy_read_timeout 95s;
    proxy_send_timeout 95s;

    access_log off;
}
