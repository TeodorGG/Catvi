# CATVI — directive Nginx adiționale pentru Plesk
#
# Se lipesc în: Websites & Domains → DOMENIU → Apache & nginx Settings →
# "Additional nginx directives". NU se adaugă aici `server { }`, `listen`,
# `server_name` sau `ssl_certificate`: Plesk le generează deja. Aici intră
# doar blocuri `location`.
#
# Înlocuiește api.DOMENIU.md cu subdomeniul real al backend-ului.
#
# De ce există acest fișier: măsurarea vitezei este corectă doar dacă
# răspunsurile nu sunt comprimate, tamponate sau păstrate în cache. Nginx-ul
# implicit din Plesk face gzip și buffering, ceea ce falsifică rezultatele.

# Dimensiunea maximă a unui transfer de test (16 MiB + marjă).
client_max_body_size 17m;

location /api/ {
    proxy_pass https://api.DOMENIU.md;
    proxy_http_version 1.1;
    proxy_set_header Host api.DOMENIU.md;
    proxy_set_header Connection '';

    # Rescrie antetele: altfel un client extern poate falsifica IP-ul folosit
    # de limitarea de rată din backend.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Obligatoriu pentru măsurători corecte.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    # Dacă instalarea Nginx are Brotli activ global, dezactivează-l și aici:
    # brotli off;

    # Un test poate dura; peste limitele implicite ale Plesk.
    proxy_read_timeout 95s;
    proxy_send_timeout 95s;

    access_log off;
}
